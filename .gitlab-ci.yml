image: node:22-bookworm

stages:
  - verify

verify:
  stage: verify
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-fund
    - npx playwright install --with-deps chromium firefox webkit
    - npm run check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
      - playwright-report/
      - test-results/
      - tests/visual-baselines/
    reports:
      junit: test-results/junit.xml

# Explicit baseline capture only. Normal verification never updates expected images.
capture-visual-baselines:
  stage: verify
  when: manual
  allow_failure: true
  script:
    - npm ci --no-fund
    - npx playwright install --with-deps chromium
    - npm run build
    - npx playwright test --project=visual --update-snapshots
  artifacts:
    expire_in: 7 days
    paths:
      - tests/visual-baselines/
